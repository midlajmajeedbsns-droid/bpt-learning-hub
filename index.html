<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPT Learning Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,serif;background:#0a1f44;color:#fff}
header{text-align:center;padding:40px 20px 20px;border-bottom:2px solid #d4af37}
h1{color:#d4af37;font-size:30px;margin:0 0 8px;letter-spacing:1px}
header p{margin:4px 0;font-size:16px;color:#e8e8e8}
h2{text-align:center;color:#d4af37;font-size:22px;margin:28px 0 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 40px;max-width:700px;margin:0 auto}
.card{background:#fff;color:#0a1f44;border-radius:14px;padding:22px 12px;text-align:center;border-top:5px solid #d4af37;font-size:17px;font-weight:bold;min-height:110px;display:flex;flex-direction:column;justify-content:center}
.card small{display:block;margin-top:8px;font-weight:normal;font-size:12px;color:#666}
footer{text-align:center;padding:20px;font-size:12px;color:#aab}
</style>
</head>
<body>
<header>
<h1>BPT LEARNING HUB</h1>
<p>Bachelor of Physiotherapy</p>
<p>First Year Study Platform</p>
</header>
<h2>First Year Subjects</h2>
<div class="grid">
<div class="card">Anatomy<small>Coming soon</small></div>
<div class="card">Physiology<small>Coming soon</small></div>
<div class="card">Psychology<small>Coming soon</small></div>
<div class="card">Sociology<small>Coming soon</small></div>
<div class="card">Fundamentals of Healthcare<small>Coming soon</small></div>
<div class="card">Electrotherapy<small>Coming soon</small></div>
</div>
<footer>BPT Learning Hub</footer>
</body>
</html>
